name: HProxy rotating proxy
version: "0.4.8.1"
slug: hproxy
description: A proxy for your home network that rotates through your own proxies or the free HProxy pool.
url: https://github.com/hproxy-com/home-assistant-addons/tree/main/hproxy
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
init: false
startup: services
boot: auto
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: The proxy, HTTP and SOCKS5 on one port
options:
  source: free
  country: ""
  socks5: false
  proxies: []
  rotate: every
  skip: []
  only: []
  log_requests: false
schema:
  source: list(free|own)
  country: match(^([A-Za-z]{2})?$)
  socks5: bool
  proxies:
    - password
  rotate: match(^(every|every:[0-9]+|every:[0-9]+m|random|on-failure)$)
  skip:
    - str
  only:
    - str
  via: password?
  log_requests: bool
