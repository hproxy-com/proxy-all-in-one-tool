name: Flipper Zero app

# HProxy for Flipper Zero, in flipper-zero/: tests the app's logic on Linux, then builds the app for
# every firmware people run on their Flipper Zero: the official release, the release before it, its
# release candidate and its development channel, and Momentum and Unleashed, each in their release
# and development channels. An app is built against one firmware's interface, so each gets its own
# file.
#
# It runs whenever something in flipper-zero/ changes. Started by hand (Actions, Flipper Zero app,
# Run workflow) with "publish" ticked, it also makes the release flipper-v<fap_version> with every
# file, their SHA-256 sums and a signed record of how each was built: a pre-release while the app is
# a beta, and never this repository's "Latest" release, which stays the command-line tool's and the
# desktop app's. This repository's releases are immutable and a workflow makes each tag with its
# release: never push a flipper-v tag by hand. A version is released once; raise fap_version in
# flipper-zero/application.fam for the next.
#
# The build uses ufbt, Flipper's own SDK tool, from PyPI at a fixed version, and only GitHub's own
# actions, each pinned to a commit.

on:
  push:
    branches: [main]
    paths: [flipper-zero/**, .github/workflows/flipper-zero.yml]
  pull_request:
    paths: [flipper-zero/**, .github/workflows/flipper-zero.yml]
  workflow_dispatch:
    inputs:
      publish:
        description: "Make the release flipper-v<version> (unticked: test and build only)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: flipper-zero

jobs:
  logic:
    name: The logic, tested on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Strict, then again under the address and undefined-behaviour sanitizers
        run: |
          for part in api keys; do
            gcc -std=c11 -Wall -Wextra -Werror -Wshadow -Wconversion -O2 -I. \
              "tests/test_hproxy_$part.c" "hproxy_$part.c" -o "test_hproxy_$part"
            "./test_hproxy_$part"
            gcc -std=c11 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I. \
              "tests/test_hproxy_$part.c" "hproxy_$part.c" -o "test_hproxy_${part}_san"
            "./test_hproxy_${part}_san"
          done

  app:
    name: ${{ matrix.name }}
    needs: logic
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Official, release
            update: --index-url=https://update.flipperzero.one/firmware/directory.json --channel=release
            file: hproxy-official.fap
          - name: Official 1.4.3, the release before
            update: --url=https://update.flipperzero.one/builds/firmware/1.4.3/flipper-z-f7-sdk-1.4.3.zip --hw-target=f7
            file: hproxy-official-1.4.3.fap
          - name: Official, release candidate
            update: --index-url=https://update.flipperzero.one/firmware/directory.json --channel=rc
            file: hproxy-official-rc.fap
          - name: Official, development
            update: --index-url=https://update.flipperzero.one/firmware/directory.json --channel=dev
            file: hproxy-official-dev.fap
          - name: Momentum, release
            update: --index-url=https://up.momentum-fw.dev/firmware/directory.json --channel=release
            file: hproxy-momentum.fap
          - name: Momentum, development
            update: --index-url=https://up.momentum-fw.dev/firmware/directory.json --channel=dev
            file: hproxy-momentum-dev.fap
          - name: Unleashed, release
            update: --index-url=https://up.unleashedflip.com/directory.json --channel=release
            file: hproxy-unleashed.fap
          - name: Unleashed, development
            update: --index-url=https://up.unleashedflip.com/directory.json --channel=dev
            file: hproxy-unleashed-dev.fap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ufbt, Flipper's SDK tool
        run: |
          python3 -m venv "$RUNNER_TEMP/ufbt"
          "$RUNNER_TEMP/ufbt/bin/pip" install --quiet ufbt==0.2.6
          echo "$RUNNER_TEMP/ufbt/bin" >> "$GITHUB_PATH"

      - name: The SDK of ${{ matrix.name }}
        env:
          UPDATE: ${{ matrix.update }}
        run: |
          # shellcheck disable=SC2086 # two options in one variable, split on purpose
          ufbt update $UPDATE

      - name: Build
        env:
          FILE: ${{ matrix.file }}
        run: |
          ufbt
          ls -l dist
          cp dist/hproxy.fap "$FILE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.file }}
          path: flipper-zero/${{ matrix.file }}
          if-no-files-found: error

  release:
    name: The release
    needs: app
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: flipper-zero/release-files
          merge-multiple: true

      - name: The sums
        run: cd release-files && sha256sum hproxy-*.fap > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: flipper-zero/release-files/hproxy-*.fap

      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ *fap_version="\([0-9.]*\)",.*/\1/p' application.fam)
          test -n "$version"
          tag="flipper-v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::$tag is released already, and a release never changes. Raise fap_version in flipper-zero/application.fam to make a new one."
            exit 1
          fi
          cat > notes.md <<'EOF'
          HProxy for Flipper Zero @VERSION@: your own proxies on the Flipper. Add any kind (typed, from a link, from a file on the SD card), see which protocols answer, and switch your hproxy rotator to a new IP. It needs a WiFi board flashed with FlipperHTTP 2.2 or newer: [how to set it up](https://github.com/hproxy-com/proxy-all-in-one-tool/tree/main/flipper-zero#readme).

          One file per firmware. Copy yours to the SD card under `apps/GPIO/`:

          | File | Firmware |
          | --- | --- |
          | `hproxy-official.fap` | Official, current release |
          | `hproxy-official-1.4.3.fap` | Official 1.4.3 |
          | `hproxy-official-rc.fap`, `hproxy-official-dev.fap` | Official, release candidate and development |
          | `hproxy-momentum.fap`, `hproxy-momentum-dev.fap` | Momentum, release and development |
          | `hproxy-unleashed.fap`, `hproxy-unleashed-dev.fap` | Unleashed, release and development |

          Built by this repository's workflow from `flipper-zero/` at this commit. Check a file against `SHA256SUMS`, or its build record with `gh attestation verify <file> --repo hproxy-com/proxy-all-in-one-tool`.
          EOF
          sed -i "s/^ *//; s/@VERSION@/${version}/" notes.md
          # A draft first, every file attached, then published: nobody ever sees a release without
          # all its files, and the repository's immutable releases lock them once it is out. A beta
          # is a pre-release, and none of them takes "Latest" from the command-line tool.
          gh release create "$tag" --draft --prerelease --title "HProxy for Flipper Zero ${version}" --notes-file notes.md --target "$GITHUB_SHA"
          gh release upload "$tag" release-files/*
          gh release edit "$tag" --draft=false --prerelease --latest=false
