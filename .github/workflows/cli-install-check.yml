name: Command-line tool, install check

# Runs the one-line installers from hproxy.com the way a person would, on clean machines of every
# kind: macOS on Apple Silicon and on Intel; Linux on x86_64, on 64-bit ARM, and on 32-bit ARM (a
# Raspberry Pi system, emulated); Windows on x64 and on ARM, in PowerShell 7 and in Windows
# PowerShell 5.1. Each one installs the released file for its machine, starts it, and asks it for
# two free proxies.
#
# Started by hand (Actions, "Command-line tool, install check", Run workflow), after a release.
# It uses no secret and changes nothing in this repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, Apple Silicon
            os: macos-latest
          - name: macOS, Intel
            os: macos-15-intel
          - name: Linux, x86_64
            os: ubuntu-latest
          - name: Linux, 64-bit ARM
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install, as the README says
        run: curl -fsSL https://hproxy.com/install.sh | sh

      - name: It starts and answers
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uname -sm
          hproxy --version
          hproxy list --limit 2

  raspberry-pi:
    name: Linux, 32-bit ARM (a Raspberry Pi system, emulated)
    runs-on: ubuntu-latest
    steps:
      - name: An ARM machine to run on (QEMU, from Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Install, as the README says, on Debian for 32-bit ARM (what Raspberry Pi OS is built on)
        run: |
          docker run --rm --platform linux/arm/v7 debian:bookworm-slim sh -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates > /dev/null
            uname -sm
            curl -fsSL https://hproxy.com/install.sh | sh
            ~/.local/bin/hproxy --version
            ~/.local/bin/hproxy list --limit 2'

  windows:
    name: Windows ${{ matrix.os == 'windows-11-arm' && 'on ARM' || 'x64' }}, PowerShell ${{ matrix.shell == 'pwsh' && '7' || '5.1' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        shell: [pwsh, powershell]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Install, as the README says
        run: irm https://hproxy.com/install.ps1 | iex

      - name: It starts and answers, from the PATH a new terminal reads
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          (Get-Command hproxy).Source
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          hproxy --version
          hproxy list --limit 2
