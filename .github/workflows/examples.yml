name: Examples

# Every example in examples/ against the released hproxy, installed the way the README says. Two
# test proxies run on the machine (tinyproxy, from Ubuntu) and the rotating proxy goes over both:
# each example's three requests have to come out through both of them, which only happens when
# the example opens a new connection per request, as it says it does.

on:
  push:
    branches: [main]
    paths: [examples/**, .github/workflows/examples.yml]
  pull_request:
    paths: [examples/**, .github/workflows/examples.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    name: ${{ matrix.name }}
    # Ubuntu 24.04: on 26.04 an AppArmor profile keeps tinyproxy to configs in /etc/tinyproxy.
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Shell (curl)
            dir: examples
            run: sh curl.sh
          - name: Python (requests)
            dir: examples/python
            setup: python3 -m pip install --quiet requests
            run: python3 requests_example.py
          - name: Python (urllib)
            dir: examples/python
            run: python3 urllib_example.py
          - name: Node.js (fetch)
            dir: examples/node
            setup: npm install --no-audit --no-fund
            run: node fetch.mjs
          - name: Go
            dir: examples/go
            run: go run main.go
          - name: Rust
            dir: examples/rust
            run: cargo run --quiet
          - name: Java
            dir: examples/java
            run: java Example.java
          - name: C#
            dir: examples/csharp
            run: dotnet run
          - name: PHP
            dir: examples/php
            run: php example.php
          - name: Ruby
            dir: examples/ruby
            run: ruby example.rb
          - name: PowerShell
            dir: examples/powershell
            run: pwsh -NoProfile -File example.ps1
          - name: Playwright
            dir: examples/playwright
            setup: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
            run: node playwright.mjs
          - name: Puppeteer
            dir: examples/puppeteer
            # Ubuntu 24.04 keeps unprivileged programs from the sandbox Chrome for Testing uses.
            setup: npm install --no-audit --no-fund && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            run: node puppeteer.mjs
          - name: Selenium
            dir: examples/selenium
            setup: python3 -m pip install --quiet selenium
            run: python3 selenium_example.py
          - name: Python (httpx)
            dir: examples/python
            setup: python3 -m pip install --quiet httpx
            run: python3 httpx_example.py
          - name: Python (aiohttp)
            dir: examples/python
            setup: python3 -m pip install --quiet aiohttp
            run: python3 aiohttp_example.py
          - name: Scrapy
            dir: examples/python
            setup: python3 -m pip install --quiet "scrapy>=2.13"
            run: python3 scrapy_example.py
          - name: Playwright (Python)
            dir: examples/playwright
            setup: python3 -m pip install --quiet playwright && python3 -m playwright install --with-deps chromium
            run: python3 playwright_example.py
          - name: Node.js (axios)
            dir: examples/node
            setup: npm install --no-audit --no-fund
            run: node axios.mjs
          - name: Node.js (got)
            dir: examples/node
            setup: npm install --no-audit --no-fund
            run: node got.mjs
          - name: Crawlee
            dir: examples/crawlee
            setup: npm install --no-audit --no-fund
            run: node crawlee.mjs
          - name: Deno
            dir: examples/deno
            # Deno's own release file, from its GitHub releases.
            setup: >-
              curl -fsSL -o "$RUNNER_TEMP/deno.zip" https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip &&
              unzip -q -o "$RUNNER_TEMP/deno.zip" -d "$HOME/.deno-bin" && echo "$HOME/.deno-bin" >> "$GITHUB_PATH"
            run: deno run --allow-net example.ts
          - name: Bun
            dir: examples/bun
            # Bun's own release file, from its GitHub releases.
            setup: >-
              curl -fsSL -o "$RUNNER_TEMP/bun.zip" https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip &&
              unzip -q -o "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP" && echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
            run: bun example.ts
          - name: Kotlin (OkHttp)
            dir: examples/kotlin
            # The Kotlin compiler's own release file, when this machine has no Kotlin.
            setup: >-
              command -v kotlin || { curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip &&
              unzip -q -o "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP" && echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"; }
            # Maven Central now and then answers a GitHub machine with "absent" for a package it has,
            # and the resolver keeps that answer in ~/.m2: one more try after forgetting it.
            run: "{ kotlin example.main.kts || { rm -rf \"$HOME/.m2/repository/com/squareup\"; sleep 10; kotlin example.main.kts; }; }"
          - name: Swift (macOS)
            os: macos-latest
            dir: examples/swift
            run: swift example.swift
          - name: C (libcurl)
            dir: examples/c
            setup: sudo apt-get install -y -qq libcurl4-openssl-dev > /dev/null
            run: cc example.c -lcurl -o "$RUNNER_TEMP/example" && "$RUNNER_TEMP/example"
          - name: Perl (LWP)
            dir: examples/perl
            setup: sudo apt-get install -y -qq libwww-perl liblwp-protocol-https-perl > /dev/null
            run: perl example.pl
          - name: R (httr)
            dir: examples/r
            # R alone (Ubuntu's R recommends compilers and more), and no manual-page index after.
            setup: sudo rm -f /var/lib/man-db/auto-update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends r-base-core r-cran-httr
            run: Rscript example.R
          - name: Command-line tools
            dir: examples/tools
            setup: sudo apt-get install -y -qq aria2 httpie > /dev/null
            run: sh tools.sh
          - name: PHP (Guzzle)
            dir: examples/php/guzzle
            setup: composer install --quiet --no-interaction
            run: php example.php
          - name: Go (Colly)
            dir: examples/go/colly
            setup: go mod tidy
            run: go run .
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: hproxy, installed the way the README says
        env:
          HPROXY_NO_UPDATE_CHECK: "1"
          HPROXY_NO_USAGE: "1"
        run: |
          curl -fsSL https://hproxy.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/hproxy" --version

      - name: Two test proxies, and the rotating proxy over both
        env:
          HPROXY_NO_UPDATE_CHECK: "1"
          HPROXY_NO_USAGE: "1"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install tinyproxy > /dev/null
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq tinyproxy > /dev/null
            sudo systemctl stop tinyproxy 2> /dev/null || true
          fi
          for port in 3128 3129; do
          printf 'Port %s\nListen 127.0.0.1\nTimeout 60\nAllow 127.0.0.1\nConnectPort 443\nLogFile "%s/tinyproxy-%s.log"\nLogLevel Connect\n' "$port" "$RUNNER_TEMP" "$port" > "$RUNNER_TEMP/tinyproxy-$port.conf"
          tinyproxy -c "$RUNNER_TEMP/tinyproxy-$port.conf"
          done
          printf '127.0.0.1:3128\n127.0.0.1:3129\n' > "$RUNNER_TEMP/proxies.txt"
          hproxy connect --file "$RUNNER_TEMP/proxies.txt" --background
          hproxy status

      - name: What the example needs
        if: matrix.setup
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.setup }}

      - name: Three requests, out through both test proxies
        working-directory: ${{ matrix.dir }}
        run: |
          ${{ matrix.run }} | tee "$RUNNER_TEMP/out.txt"
          lines=$(grep -c 'ip=' "$RUNNER_TEMP/out.txt" || true)
          first=$(grep -c 'Request (file descriptor' "$RUNNER_TEMP/tinyproxy-3128.log" || true)
          second=$(grep -c 'Request (file descriptor' "$RUNNER_TEMP/tinyproxy-3129.log" || true)
          echo "answers: $lines, through the first test proxy: $first, through the second: $second"
          test "$lines" -eq 3
          if grep -q 'ip= \|ip=?\|ip=undefined\|ip=None' "$RUNNER_TEMP/out.txt"; then
            echo "::error::an answer without an address"
            exit 1
          fi
          test "$first" -ge 1
          test "$second" -ge 1

  new-ip:
    name: New IP on demand, ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: curl
            run: sh new_ip.sh
          - name: Python
            run: python3 new_ip.py
          - name: Node.js
            run: node new_ip.mjs
          - name: PowerShell
            run: pwsh -NoProfile -File new_ip.ps1
          - name: Go
            run: go run main.go
    defaults:
      run:
        shell: bash
    env:
      HPROXY_NO_UPDATE_CHECK: "1"
      HPROXY_NO_USAGE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: hproxy, two test proxies, and the rotating proxy on one of them until asked
        run: |
          curl -fsSL https://hproxy.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq tinyproxy > /dev/null
          sudo systemctl stop tinyproxy 2> /dev/null || true
          for port in 3128 3129; do
          printf 'Port %s\nListen 127.0.0.1\nTimeout 60\nAllow 127.0.0.1\nConnectPort 443\nLogFile "%s/tinyproxy-%s.log"\nLogLevel Connect\n' "$port" "$RUNNER_TEMP" "$port" > "$RUNNER_TEMP/tinyproxy-$port.conf"
          tinyproxy -c "$RUNNER_TEMP/tinyproxy-$port.conf"
          done
          printf '127.0.0.1:3128\n127.0.0.1:3129\n' > "$RUNNER_TEMP/proxies.txt"
          hproxy connect --file "$RUNNER_TEMP/proxies.txt" --rotate on-failure --background

      - name: The example switches from proxy 1 to proxy 2, and traffic follows
        working-directory: examples/new-ip
        run: |
          seen() { grep -c 'Request (file descriptor' "$RUNNER_TEMP/tinyproxy-$1.log" || true; }
          curl -fsS -o /dev/null -x http://127.0.0.1:8080 https://hproxy.com/cdn-cgi/trace
          ${{ matrix.run }} | tee "$RUNNER_TEMP/out.txt"
          curl -fsS -o /dev/null -x http://127.0.0.1:8080 https://hproxy.com/cdn-cgi/trace
          first=$(seen 3128); second=$(seen 3129)
          echo "through the first test proxy: $first, through the second: $second"
          if [ "${{ matrix.name }}" = curl ]; then
            grep -q '"member":2' "$RUNNER_TEMP/out.txt"
          else
            grep -q 'now:   proxy 1 of 2' "$RUNNER_TEMP/out.txt"
            grep -q 'after: proxy 2 of 2' "$RUNNER_TEMP/out.txt"
          fi
          test "$first" -ge 1
          test "$second" -ge 1
