name: Command-line tool

# Builds the hproxy command-line tool from source-code/ for every system and processor it runs on,
# proves that each file starts and reaches hproxy.com on a machine of its kind, and attaches the
# files, their SHA-256 sums and a signed record of how each was built to a release named
# cli-v<version>.
#
# Started by hand (Actions, Command-line tool, Run workflow): unticked, "publish" only builds and
# proves every file; ticked, or on a pushed tag cli-v<version>, it also makes the release. A version
# is built once: hproxy.com's installers check every file against the sum published here, so the
# files of a release never change.
#
# Every file stands alone: a Linux file carries its own C library (musl), a Windows file its own C
# runtime, so nothing has to be installed beside it. It uses no secret: only this repository's own
# token, and only GitHub's own actions, each pinned to a commit (the repository allows nothing else:
# a tag can be moved, a commit cannot). To update one, pin the commit its new release tag points to.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Make the release (unticked: build and prove every file only)"
        type: boolean
        default: false
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            file: hproxy-cli-macos-arm64
            run: native
          - os: macos-latest
            target: x86_64-apple-darwin
            file: hproxy-cli-macos-x86_64
            run: "no"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            file: hproxy-cli-linux-x86_64
            run: native
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            file: hproxy-cli-linux-arm64
            run: native
          - os: ubuntu-22.04
            target: arm-unknown-linux-musleabihf
            file: hproxy-cli-linux-armv6
            run: qemu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: hproxy-cli-windows-x86_64.exe
            run: native
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            file: hproxy-cli-windows-arm64.exe
            run: "no"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: source-code
    env:
      # The oldest macOS each Mac file starts on: the first for Apple Silicon, High Sierra for Intel.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'x86_64-apple-darwin' && '10.13' || '11.0' }}
      # Windows: the C runtime inside the program, so it starts on a Windows that has no Visual C++
      # runtime installed.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      # 64-bit ARM Linux: Ubuntu's musl-gcc (the cc crate would look for aarch64-linux-musl-gcc).
      CC_aarch64_unknown_linux_musl: musl-gcc
      # 32-bit ARM Linux, ARMv6 and newer (every Raspberry Pi): Ubuntu's ARM compiler; the cc crate
      # adds -march=armv6 -marm -mfpu=vfp for this target.
      CC_arm_unknown_linux_musleabihf: arm-linux-gnueabihf-gcc
      AR_arm_unknown_linux_musleabihf: arm-linux-gnueabihf-ar
      CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-gnueabihf-gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Rust, as GitHub's machine has it (nothing is fetched and run to get it)
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            echo "::error::this machine has no Rust; the build uses only the toolchain GitHub installs"
            exit 1
          fi
          cargo --version

      - name: Linux tools (musl; for 32-bit ARM the ARM compiler and an ARMv6 machine to run on)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = arm-unknown-linux-musleabihf ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
          fi

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: The C compiler for ARM Windows (ring compiles its C code with clang there)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: clang --version

      - name: Build
        run: cargo build --release --locked -p hproxy-cli --target ${{ matrix.target }}

      - name: Name the file
        run: |
          src="target/${{ matrix.target }}/release/hproxy"
          if [ "${{ runner.os }}" = "Windows" ]; then src="$src.exe"; fi
          cp "$src" "../${{ matrix.file }}"

      - name: Nothing has to be installed beside it (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          file "${{ matrix.file }}" | tee kind.txt
          grep -Eq "statically linked|static-pie linked" kind.txt

      - name: Nothing has to be installed beside it (macOS), and the oldest macOS it starts on
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          otool -L "${{ matrix.file }}" | tee libs.txt
          if tail -n +2 libs.txt | grep -Ev "^[[:space:]]+/(usr/lib|System/Library)/"; then
            echo "::error::a library outside the system"; exit 1
          fi
          # A file for macOS 10.14 and later records its oldest macOS as LC_BUILD_VERSION "minos",
          # an older one as LC_VERSION_MIN_MACOSX "version".
          oldest=$(otool -l "${{ matrix.file }}" | awk '$1 == "minos" || ($1 == "version" && cmd == "LC_VERSION_MIN_MACOSX") { print $2; exit } $1 == "cmd" { cmd = $2 }')
          echo "the oldest macOS it starts on: $oldest"
          test "$oldest" = "$MACOSX_DEPLOYMENT_TARGET"

      - name: Nothing has to be installed beside it (Windows, no Visual C++ runtime)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $needs = & $dumpbin /nologo /dependents "${{ matrix.file }}"
          $needs
          if ($needs -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw 'the program still needs the Visual C++ runtime' }

      - name: It starts and reaches hproxy.com
        if: matrix.run != 'no'
        working-directory: .
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' source-code/Cargo.toml | head -1)
          run="./${{ matrix.file }}"
          if [ "${{ matrix.run }}" = qemu ]; then run="qemu-arm -cpu arm1176 ./${{ matrix.file }}"; fi
          $run --version | tee said.txt
          grep -q "hproxy $version" said.txt
          $run --help > /dev/null
          $run list --limit 2

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  windows-arm:
    name: hproxy-cli-windows-arm64.exe on Windows on ARM
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hproxy-cli-windows-arm64.exe

      - name: It starts and reaches hproxy.com
        shell: powershell
        run: |
          $version = (Select-String -Path source-code\Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $said = .\hproxy-cli-windows-arm64.exe --version
          $said
          if ($said -notmatch [regex]::Escape("hproxy $version")) { throw "it says $said, not hproxy $version" }
          .\hproxy-cli-windows-arm64.exe --help | Out-Null
          .\hproxy-cli-windows-arm64.exe list --limit 2
          if ($LASTEXITCODE -ne 0) { throw "list ended with $LASTEXITCODE" }

  release:
    needs: [build, windows-arm]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: The sums
        run: cd dist && sha256sum hproxy-cli-* > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/hproxy-cli-*

      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' source-code/Cargo.toml | head -1)
          tag="cli-v${version}"
          cat > notes.md <<EOF
          The hproxy command-line tool ${version}: check proxies, list the free pool, look up an address, connect through a proxy, and give the same tools to an AI assistant with \`hproxy mcp\`.

          Install it in one line: \`curl -fsSL https://hproxy.com/install.sh | sh\` on macOS and Linux, or \`irm https://hproxy.com/install.ps1 | iex\` in PowerShell on Windows. The installer picks the file for your system and processor and checks it against its SHA-256 before it puts it in place.

          Built by this repository's workflow from \`source-code/\` at this commit, with no secret involved. Each file stands alone: the Linux files carry their own C library, the Windows files their own C runtime. Check a file against \`SHA256SUMS\`, or its build record with \`gh attestation verify <file> --repo hproxy-com/proxy-all-in-one-tool\`.

          | File | System |
          | --- | --- |
          | \`hproxy-cli-macos-arm64\` | macOS 11 and later, Apple Silicon |
          | \`hproxy-cli-macos-x86_64\` | macOS 10.13 and later, Intel |
          | \`hproxy-cli-linux-x86_64\` | Linux on x86_64, any distribution |
          | \`hproxy-cli-linux-arm64\` | Linux on 64-bit ARM: ARM servers, Raspberry Pi 3, 4 and 5 with a 64-bit system |
          | \`hproxy-cli-linux-armv6\` | Linux on 32-bit ARM: every Raspberry Pi with a 32-bit system, Pi Zero and Pi 1 included |
          | \`hproxy-cli-windows-x86_64.exe\` | Windows 10 and 11, x64 |
          | \`hproxy-cli-windows-arm64.exe\` | Windows 11 on ARM |
          EOF
          # A version is built once. hproxy.com's installers check every file against the sum
          # published here, so the files of a release never change: to build again, raise the
          # version in source-code/Cargo.toml.
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::$tag is released already, and a release never changes. Raise the version in source-code/Cargo.toml to build a new one."
            exit 1
          fi
          gh release create "$tag" dist/* --title "hproxy command-line tool ${version}" --notes-file notes.md --target "$GITHUB_SHA"
