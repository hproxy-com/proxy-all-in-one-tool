[package]
name = "hproxy-probe"
description = "The HProxy proxy-checking engine: parse a proxy line, dial it, climb the judge ladder on HTTP, HTTPS, SOCKS4 and SOCKS5, grade anonymity, measure where the time went, name the exit."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["proxy", "socks5", "proxy-checker", "http-proxy", "networking"]
categories = ["network-programming"]

[dependencies]
# The async runtime every probe runs on. `sync` gives Semaphore (the governor)
# and OnceCell (one-shot own-address detection).
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# SOCKS4 and SOCKS5 greetings over a socket WE opened, so the TCP connect and
# the proxy's admission step are two separately timed phases.
tokio-socks = "0.5"

# TLS we drive ourselves for the CONNECT-tunnel probe, so the handshake is a
# phase of its own. `default-features = false` is load-bearing: the default
# backend would compile a second, large C crypto library into every binary.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The public root store (Mozilla's), to tell a proxy that relays HTTPS from one
# that re-signs it with its own authority and can read everything inside. The
# same crate every HTTPS client in this workspace already carries.
webpki-roots = "1"

# Raise and read the open-file limit. Unix only, because that is where the
# problem lives: macOS ships a soft limit of 256 and every in-flight probe
# holds sockets. Windows does not cap sockets this way.
[target.'cfg(unix)'.dependencies]
rlimit = "0.11"

[dev-dependencies]
futures = "0.3"
