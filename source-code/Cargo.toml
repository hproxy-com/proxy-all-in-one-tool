# One workspace, one lock file, one engine. The Rust half of
# Hproxy-Software-Bundle-Core (the folder layout is in README.md).
#
#   proxy-engine/hproxy-probe   THE ENGINE. Parses a proxy line, dials it, climbs the
#                               judge ladder on every transport, grades anonymity,
#                               measures where the time went, names the exit. No
#                               database, no web framework, no UI. Every door below
#                               reads it, so every door gives the same verdict.
#   proxy-engine/hproxy-relay   THE CONNECTOR. A local proxy with no password that
#                               forwards to the real one with the password attached.
#   proxy-engine/hproxy-api     The client for hproxy.com's free doors: IP locations,
#                               API-mode checking, the free list.
#   proxy-engine/hproxy-places  The places a person connects through, and what each
#                               one is (the targeting a provider puts in a username).
#   proxy-engine/hproxy-tunnel  Phones: every app's packets through the relay (the VPN),
#                               and the firewall's way out for each app.
#   proxy-engine/hproxy-connection  One connection for every door: a place becomes the
#                               relay's source, the relay switches in place, probes say
#                               whether traffic really gets through.
#   proxy-engine/hproxy-mobile  The engine for the native phone app (phone-android):
#                               libhproxy.so, called from Kotlin through JNI.
#   command-line-tool           `hproxy`: check, connect, free, list, ip, and `mcp`
#                               for AI assistants. Servers, scripts and agents.
#   desktop-app/src-tauri       The desktop app (Windows, macOS, Linux) and the phone
#                               app (Android in src-tauri/gen/android): the engine and
#                               the relay with a window.
#
# The release profile lives here because Cargo only honours [profile] at the
# workspace root. `strip` and `lto` are what keep the installer a few MB.

[workspace]
resolver = "2"
members = [
    "proxy-engine/hproxy-probe",
    "proxy-engine/hproxy-relay",
    "proxy-engine/hproxy-system",
    "proxy-engine/hproxy-api",
    "proxy-engine/hproxy-places",
    "proxy-engine/hproxy-tunnel",
    "proxy-engine/hproxy-connection",
    "proxy-engine/hproxy-mobile",
    "command-line-tool",
    "desktop-app/src-tauri",
]

[workspace.package]
version = "0.3.8"
edition = "2021"
license = "MIT"
authors = ["HProxy"]
repository = "https://github.com/hproxy-com/proxy-all-in-one-tool"

[workspace.dependencies]
hproxy-cli = { path = "command-line-tool" }
hproxy-probe = { path = "proxy-engine/hproxy-probe" }
hproxy-relay = { path = "proxy-engine/hproxy-relay" }
hproxy-system = { path = "proxy-engine/hproxy-system" }
hproxy-api = { path = "proxy-engine/hproxy-api" }
hproxy-places = { path = "proxy-engine/hproxy-places" }
hproxy-tunnel = { path = "proxy-engine/hproxy-tunnel" }
hproxy-connection = { path = "proxy-engine/hproxy-connection" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Built for size. Everything this workspace does waits on the network, not the
# CPU, so the smallest code costs nothing a person can notice. Measured on
# 2026-09-19 (Windows x64, the CLI): opt-level 3 with thin LTO 5.45 MB, "s"
# with fat LTO 3.83 MB, "z" with fat LTO 3.51 MB; parsing and printing 200,000
# lines took 1.9 s, 2.0 s and 2.1 s, while checking one proxy takes 0.1 to 16 s.
# Panics still unwind: a worker that panics must end its task, not the program.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# The phone app's engine (phone-android builds it with --profile phone). On a
# phone the VPN moves every packet of every app through Rust (hproxy-tunnel),
# so here the CPU is the cost that matters: built for speed, not for size.
[profile.phone]
inherits = "release"
opt-level = 3
