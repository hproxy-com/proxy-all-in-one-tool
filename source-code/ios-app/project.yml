# The iPhone app's Xcode project, as text: XcodeGen makes HProxy.xcodeproj from this
# file, and the generated project is never committed (scripts/build-engine.sh and
# codemagic.yaml at the top of this repository do the rest).
#
# Two targets, because iOS runs a connection in a process of its own: HProxy draws
# the screens, Tunnel holds the connection. Both reach the same folder through the
# App Group, and both link the Rust engine.
name: HProxy
options:
  bundleIdPrefix: com.hproxy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_OBJC_BRIDGING_HEADER: Shared/hproxy.h
    LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(PROJECT_DIR)/engine/iphoneos
    LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(PROJECT_DIR)/engine/iphonesimulator
    OTHER_LDFLAGS: -lhproxy_mobile -lresolv -framework Security -framework SystemConfiguration -framework CoreFoundation

targets:
  HProxy:
    type: application
    platform: iOS
    sources:
      - HProxy
      - Shared
    dependencies:
      - target: Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hproxy.app
        PRODUCT_NAME: HProxy
        INFOPLIST_FILE: HProxy/Info.plist
        CODE_SIGN_ENTITLEMENTS: HProxy/HProxy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone and iPad, on the targets because XcodeGen's defaults sit there.
        TARGETED_DEVICE_FAMILY: "1,2"

  Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - path: Shared
        excludes:
          - hproxy.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hproxy.app.tunnel
        PRODUCT_NAME: Tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  # The real engine under the Swift models, in the app, on the Simulator.
  HProxyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: HProxy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hproxy.app.tests
        GENERATE_INFOPLIST_FILE: true
        # The app it runs in holds the engine already.
        OTHER_LDFLAGS: ""

schemes:
  HProxy:
    build:
      targets:
        HProxy: all
        HProxyTests: [test]
    test:
      targets:
        - HProxyTests
